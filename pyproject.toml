[project]
name = "agentprobe"
version = "0.1.0"
description = "Trajectory-level evaluation and distillation verification for open-weight agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "streamlit>=1.62.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]