name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install CPU dependencies
        run: uv sync --locked --dev
      - name: Unit and regression tests
        run: uv run --locked pytest -q
      - name: Verify dataset isolation
        run: uv run --locked python -m agentprobe.check_leakage
      - name: Build and test installed package outside checkout
        run: |
          uv build --wheel
          uv venv .wheel-smoke --python 3.11
          uv pip install --python .wheel-smoke/bin/python --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -m agentprobe.check_leakage
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -m agentprobe.run_eval --help
          mkdir -p "$RUNNER_TEMP/agentprobe-wheel-work"
          cd "$RUNNER_TEMP/agentprobe-wheel-work"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
